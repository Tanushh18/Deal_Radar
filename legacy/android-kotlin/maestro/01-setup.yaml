# Fresh-install path: setup screen → connect to the live server → sign-in page.
# Runs from zero state, so it is the flow to trust after changing ServerConfig
# or SetupActivity.
#
#   maestro test android/maestro/01-setup.yaml
appId: com.dealradar.app
---
- launchApp:
    clearState: true

# A loaded emulator throws system ANRs ("<something> isn't responding") whose
# dialog covers the app and hides every selector under it. Optional, so this is
# a no-op on a healthy device rather than a required step.
- tapOn:
    text: "Wait"
    optional: true

# --- setup screen ---
# extendedWaitUntil rather than assertVisible: cold start on an emulator can
# exceed the default assertion timeout, which fails a perfectly good app.
- extendedWaitUntil:
    visible: "Connect to your DealRadar server"
    timeout: 60000
- assertVisible: "https://dealradar-k2hb.onrender.com"
- assertVisible: "Live server"
- tapOn: "Connect"
- tapOn:
    text: "Wait"
    optional: true

# The probe allows up to 70s for a sleeping free-tier instance to wake, so the
# assertion has to outwait it rather than fail on a cold start.
- extendedWaitUntil:
    visible: "Sign in with Telegram"
    timeout: 90000

# --- the web UI is really loaded, not just a blank WebView ---
# Wildcards are required, not stylistic: Maestro matches a node's *entire* text,
# and both of these share a DOM node with the rest of their sentence (the h1
# carries both headline lines; each <li> carries its whole bullet).
- assertVisible: ".*Every deal from your Telegram channels.*"
- assertVisible: ".*Cross-channel dedup.*"
