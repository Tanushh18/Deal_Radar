# Render blueprint — fixed 3-server split (New > Blueprint > point at this repo).
#   dealradar-ingest-1 / dealradar-ingest-2: each reads Telegram with its own account and half of
#     the channels, and forwards sign-in/devices/watchlists/admin to the user server.
#   dealradar-user: no Telegram; owns user writes, watchlist alerts, digests and notifications.
# Every server serves deal browsing itself. Secrets are filled once in the dealradar-shared
# group (Render dashboard > Environment Groups). Rename the services below to your existing
# service names if you want Render to adopt them instead of creating new ones.
services:
  - type: web
    name: dealradar-ingest-1
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One worker: Telethon holds stateful MTProto connections. Do not raise this on the free tier.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - fromGroup: dealradar-shared
      - key: NODE_ROLE
        value: ingest
      - key: INGEST_SHARD
        value: "0"
      - key: USER_NODE_URL
        sync: false             # the user server's own URL, e.g. https://dealradar-93do.onrender.com
      - key: TELEGRAM_SESSION
        sync: false             # this server's Telegram account (tools/make_session.py)
      - key: PUBLIC_URL
        sync: false             # https://dealradar.ggnhome.com (or this server's own URL)

  - type: web
    name: dealradar-ingest-2
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One worker: Telethon holds stateful MTProto connections. Do not raise this on the free tier.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - fromGroup: dealradar-shared
      - key: NODE_ROLE
        value: ingest
      - key: INGEST_SHARD
        value: "1"
      - key: USER_NODE_URL
        sync: false             # the user server's own URL, e.g. https://dealradar-93do.onrender.com
      - key: TELEGRAM_SESSION_2
        sync: false             # this server's Telegram account (tools/make_session.py)
      - key: PUBLIC_URL
        sync: false             # https://dealradar.ggnhome.com (or this server's own URL)

  - type: web
    name: dealradar-user
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One worker: Telethon holds stateful MTProto connections. Do not raise this on the free tier.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - fromGroup: dealradar-shared
      - key: NODE_ROLE
        value: user
      - key: PUBLIC_URL
        sync: false             # https://dealradar.ggnhome.com

envVarGroups:
  - name: dealradar-shared
    envVars:
      # --- secrets: identical on all three servers ---
      - key: SECRET_KEY
        sync: false             # SAME on all three servers. Rotating it invalidates stored Telegram sessions AND all web logins
      - key: ADMIN_TOKEN
        sync: false

      # --- you must fill these in (Render dashboard > Environment) ---
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false             # mongodb+srv://user:password@cluster.mongodb.net/ — durable store for
                                 # users, channels, watchlists and admin settings
      - key: TURSO_DATABASE_URL
        sync: false             # libsql://<db>-<org>.turso.io — permanent store: deals, product summaries, alerts
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Optional second Turso database, just for price_points (every price
      # change ever seen — by far the fastest-growing table). Without these
      # two, price_points stays in the main Turso database above instead.
      - key: TURSO_DB_02
        sync: false             # libsql://<db2>-<org>.turso.io — a second, separate Turso database
      - key: TURSO_DB_02_AUTH_TOKEN
        sync: false

      # --- your own Telegram channel: hot deals posted within seconds ---
      - key: TG_BOT_TOKEN
        sync: false             # from @BotFather; the bot must be an admin of the channel
      - key: TG_POST_CHANNEL
        sync: false             # "@yourchannel" or its numeric id "-100…"
      - key: TG_HOT_MIN_DISCOUNT
        value: "60"             # % off that counts as hot (all-time lows always do)
      - key: TG_HOT_MIN_REPOSTS
        value: "3"              # or: this many channels posted the same product
      - key: TG_MAX_POSTS_PER_HOUR
        value: "20"

      # --- reader account: reads every channel it follows (block in /admin) ---
      # Optional: extra public channels to make the reader join, comma-separated.
      - key: PUBLIC_CHANNELS
        sync: false

      # --- tuning ---
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: POLL_INTERVAL_SECONDS
        value: "2400"           # 40 min
      - key: DEAL_TTL_HOURS
        value: "96"
      - key: LOCAL_CACHE_DAYS
        value: "15"             # local SQLite keeps this many days (capped by the Turso retention)
      - key: TURSO_DEAL_RETENTION_DAYS
        value: "5"              # Turso auto-deletes deals this many days after first saved; 0 = keep forever
      - key: BACKFILL_LIMIT
        value: "120"
      - key: INCREMENTAL_LIMIT
        value: "60"
      - key: LIVENESS_CHECK
        value: "true"
      - key: LIVENESS_BATCH
        value: "40"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_SECONDS
        value: "600"
      - key: DB_PATH
        value: "data/deals.db"
      - key: SESSION_TTL_DAYS
        value: "180"
      - key: LOG_LEVEL
        value: "INFO"
