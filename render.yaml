# Render blueprint — deploy with: New > Blueprint > point at this repo.
# Everything here fits the free tier (one web service, no paid disk, no Redis).
services:
  - type: web
    name: dealradar
    runtime: python
    plan: free
    region: singapore          # closest free region to India; change if you prefer
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One worker: Telethon holds stateful MTProto connections and the ingest
    # scheduler must not run in duplicate. Do not raise this on the free tier.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      # --- generated for you ---
      - key: SECRET_KEY
        generateValue: true     # rotating this invalidates stored Telegram sessions AND all web logins
      - key: ADMIN_TOKEN
        generateValue: true

      # --- you must fill these in (Render dashboard > Environment) ---
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false             # mongodb+srv://user:password@cluster.mongodb.net/ — durable store for
                                 # users, channels, watchlists and admin settings
      - key: PUBLIC_URL
        sync: false             # e.g. https://dealradar.onrender.com — enables self-ping
      - key: TURSO_DATABASE_URL
        sync: false             # libsql://<db>-<org>.turso.io — permanent store: deals, product summaries, alerts
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Optional second Turso database, just for price_points (every price
      # change ever seen — by far the fastest-growing table). Without these
      # two, price_points stays in the main Turso database above instead.
      - key: TURSO_DB_02
        sync: false             # libsql://<db2>-<org>.turso.io — a second, separate Turso database
      - key: TURSO_DB_02_AUTH_TOKEN
        sync: false

      # --- your own Telegram channel: hot deals posted within seconds ---
      - key: TG_BOT_TOKEN
        sync: false             # from @BotFather; the bot must be an admin of the channel
      - key: TG_POST_CHANNEL
        sync: false             # "@yourchannel" or its numeric id "-100…"
      - key: TG_HOT_MIN_DISCOUNT
        value: "60"             # % off that counts as hot (all-time lows always do)
      - key: TG_HOT_MIN_REPOSTS
        value: "3"              # or: this many channels posted the same product
      - key: TG_MAX_POSTS_PER_HOUR
        value: "20"

      # --- reader account: reads every channel it follows (block in /admin) ---
      - key: TELEGRAM_SESSION
        sync: false             # from /admin after logging in (secret — full account access)
      # Optional: extra public channels to make the reader join, comma-separated.
      - key: PUBLIC_CHANNELS
        sync: false

      # --- tuning ---
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: POLL_INTERVAL_SECONDS
        value: "2400"           # 40 min
      - key: DEAL_TTL_HOURS
        value: "96"
      - key: LOCAL_CACHE_DAYS
        value: "15"             # local SQLite keeps this many days; Turso keeps everything
      - key: BACKFILL_LIMIT
        value: "120"
      - key: INCREMENTAL_LIMIT
        value: "60"
      - key: LIVENESS_CHECK
        value: "true"
      - key: LIVENESS_BATCH
        value: "40"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_SECONDS
        value: "600"
      - key: DB_PATH
        value: "data/deals.db"
      - key: SESSION_TTL_DAYS
        value: "180"
      - key: LOG_LEVEL
        value: "INFO"
