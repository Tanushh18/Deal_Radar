# Render blueprint — deploy with: New > Blueprint > point at this repo.
# Everything here fits the free tier (one web service, no paid disk, no Redis).
services:
  - type: web
    name: dealradar
    runtime: python
    plan: free
    region: singapore          # closest free region to India; change if you prefer
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One worker: Telethon holds stateful MTProto connections and the ingest
    # scheduler must not run in duplicate. Do not raise this on the free tier.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      # --- generated for you ---
      - key: SECRET_KEY
        generateValue: true     # rotating this invalidates stored Telegram sessions
      - key: ADMIN_TOKEN
        generateValue: true

      # --- you must fill these in (Render dashboard > Environment) ---
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_B64
        sync: false
      - key: PUBLIC_URL
        sync: false             # e.g. https://dealradar.onrender.com — enables self-ping

      # --- tuning ---
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: DEAL_TTL_HOURS
        value: "96"
      - key: BACKFILL_LIMIT
        value: "120"
      - key: INCREMENTAL_LIMIT
        value: "60"
      - key: LIVENESS_CHECK
        value: "true"
      - key: LIVENESS_BATCH
        value: "40"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_SECONDS
        value: "600"
      - key: SHEETS_FLUSH_SECONDS
        value: "120"
      - key: DB_PATH
        value: "data/deals.db"
      - key: LOG_LEVEL
        value: "INFO"
