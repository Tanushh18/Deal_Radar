name: EAS Build

# Builds a real native binary via EAS — needed whenever something native
# changed (permissions, native modules, app.json ios/android block) that an
# OTA (eas-update.yml) can't cover. Manual only: this consumes EAS build
# credits, unlike the JS-only OTA workflow which runs on every push.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: "Platform to build (ios preview builds for Simulator only — no Apple Developer account is configured for device signing)"
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (${{ inputs.platform }} / ${{ inputs.profile }})
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --non-interactive --no-wait
