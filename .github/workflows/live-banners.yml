name: Live sale banners

# Renders amazon.in / flipkart.com / myntra.com in headless Chromium, grabs the
# running sale banners and pushes them to the server. Needs repo secrets
# SITE_URL (e.g. https://your-app.onrender.com) and ADMIN_TOKEN.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python tools/fetch_banners.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
