name: EAS Diagnose

# One-off inspection: what's actually published on each channel/branch, and
# what the most recent builds look like. Not part of the normal pipeline —
# manual trigger only, for debugging an update that isn't reaching a device.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Who am I
        run: eas whoami --non-interactive || true

      - name: Channels
        run: eas channel:list --non-interactive || true

      - name: Preview channel detail
        run: eas channel:view preview --non-interactive || true

      - name: Production channel detail
        run: eas channel:view production --non-interactive || true

      - name: Recent Android builds
        run: eas build:list --platform android --limit 5 --non-interactive || true
